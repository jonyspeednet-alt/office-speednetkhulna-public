# Dependabot: weekly security updates for all Node surfaces
#
# `ignore` blocks below suppress automatic MAJOR version bumps for packages whose
# major upgrades break peer-dependency resolution (e.g. react vs react-dom,
# eslint vs eslint-plugin-*, vite vs @vitejs/plugin-react) and therefore need a
# coordinated migration with manual testing. Minor/patch updates are batched into
# one PR per directory via the `groups` blocks.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    groups:
      server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "body-parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ejs"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    groups:
      client-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react majors require a newer vite than the pinned one.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/whatsapp-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 3
    labels: ["dependencies", "security"]
    groups:
      whatsapp-worker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "body-parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ejs"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/client-partner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 3
    labels: ["dependencies", "security"]
    groups:
      client-partner-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react majors require a newer vite than the pinned one.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/technician-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 3
    labels: ["dependencies", "security"]
    groups:
      technician-app-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # This directory is NOT built or tested by CI (deploy.yml only covers
      # server/client/client-partner). The Expo SDK, its expo-* packages, react
      # and react-native are version-locked to each other and must be moved
      # together by hand (npx expo install --fix, SDK upgrade). ALL update types
      # are ignored for them, because Dependabot classifies react-native
      # 0.79.6 -> 0.88.0 as a *minor* bump and it would silently break the app
      # with no CI to catch it.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-native"
