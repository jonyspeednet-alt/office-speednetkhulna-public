name: secrets-scan
on: [push, pull_request, workflow_call]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block tracked secrets and internal files
        run: |
          FAIL=0
          # 1. forbidden tracked paths
          if git ls-files | grep -E "^(secrets/|\.qa/|\.env($|\.)|.*ssh_key|.*ACCESS_CREDENTIALS|memory/|^MEMORY\.md|^TOOLS\.md|^USER\.md|user_phone.*\.txt|scratch/|\.ai/|tmp_.*\.js|check_.*\.js|clean_.*\.js|fix_.*\.js|rca_.*\.js|set_.*\.js|reset_.*\.js|verify_.*\.js|gen_local\.js)"; then
            echo "FAIL: internal/one-off files must not be tracked. See .gitignore."
            FAIL=1
          fi
          # 2. generic hardcoded-credential shapes in tracked files (no real values here).
          # Lines containing ${PLACEHOLDERS}, process.env, or documented example values are safe.
          # Hook/example/template files contain guard patterns only — excluded so they don't self-flag.
          # Keys require "=" (assignment) so mentions/comments/column refs don't false-positive.
          if grep -rnE "PGPASSWORD=.+psql|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|JWT_SECRET *=|SESSION_SECRET *=|API_TOKEN *=|API_KEY *=|ROUTER_VAULT_KEY *=|password_enc *=" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.md" --include="*.sh" --include="*.ps1" --include="pre-commit" . 2>/dev/null | grep -v ".git/" | grep -v node_modules | grep -v ".github/hooks/" | grep -v "ops/pre-commit-hook.sh" | grep -v ".example" | grep -v "process\.env" | grep -v "REDACTED" | grep -v "placeholder" | grep -v "example" | grep -v "change_me" | grep -v "your_jwt" | grep -v "your_" | grep -v "secrets-scan" | grep -v '\${' | grep -v '\$' | grep -v "your_server_ip_here" | grep -v "your_db_\|your_ssh_" | grep -q .; then
            echo "FAIL: possible hardcoded credential found."
            FAIL=1
          fi
          exit $FAIL
